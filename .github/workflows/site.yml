name: Validate, build & deploy
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: '0 6 * * 1' }]   # weekly rebuild refreshes live GitHub star counts
  workflow_dispatch:
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Harness self-check (baseline must fail, reference must pass)
        run: node harness/validate.mjs
      - name: Re-verify every published run (re-apply diff, re-score, must match the record)
        run: node harness/verify.mjs
      - name: Refresh GitHub agent directory (weekly schedule / manual runs)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/fetch-github-agents.mjs --limit 1200 && node scripts/newsletter.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save refreshed data (weekly growth history + newsletter archive)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "agentrank-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/directory.json data/newsletter
          git diff --cached --quiet || { git commit -m "Weekly data refresh $(date -u +%F)" && git push; }
      - name: Build site
        run: SITE_URL="https://$(echo "$OWNER" | tr '[:upper:]' '[:lower:]').github.io/$REPO_NAME" node site/build.mjs
        env:
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          BASE_PATH: /${{ github.event.repository.name }}
          REPO_SLUG: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          BUTTONDOWN_USERNAME: ${{ vars.BUTTONDOWN_USERNAME }}
      - name: Render share cards (Chrome is preinstalled on ubuntu runners)
        run: node site/og.mjs
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with: { path: dist }
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
